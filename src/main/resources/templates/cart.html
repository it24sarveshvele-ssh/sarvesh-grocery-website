
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | FreshMart</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7faf5;
            color: #263528;
        }
        header {
            background: #216b42;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h2 { margin: 0; }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-weight: bold;
        }
        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000010;
        }
        h1 { color: #216b42; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e5e5;
        }
        th { background: #e4f3d9; }
        .total {
            text-align: right;
            color: #216b42;
            font-size: 23px;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background: #216b42;
            color: white;
            text-decoration: none;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .empty { text-align: center; padding: 30px; }
        footer {
            text-align: center;
            background: #173f2a;
            color: white;
            padding: 18px;
            margin-top: 35px;
        }
    </style>
</head>
<body>
<header>
    <h2>🥬 FreshMart</h2>
    <nav>
        <a href="/">Home</a>
        <a href="/products">Shop Products</a>
        <a href="/cart">Cart</a>
    </nav>
</header>

<main>
    <h1>Your Shopping Cart</h1>

    <div th:if="${cart.isEmpty()}" class="empty">
        <h3>Your cart is empty 🛒</h3>
        <p>Visit our shop and add some fresh groceries.</p>
        <a class="btn" href="/products">Shop Products</a>
    </div>

    <div th:unless="${cart.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart}">
                <td th:text="${item.key}">Product</td>
                <td th:text="'₹' + ${products.get(item.key).price()}">₹0</td>
                <td th:text="${item.value}">1</td>
                <td th:text="'₹' + ${products.get(item.key).price() * item.value}">₹0</td>
            </tr>
            </tbody>
        </table>

        <p class="total">Total: ₹<span th:text="${total}">0</span></p>

        <a class="btn" href="/products">Continue Shopping</a>
        <a class="btn" href="/checkout">Proceed to Checkout</a>
    </div>
</main>

<footer>
    <p>© 2026 FreshMart — Freshness at your doorstep.</p>
</footer>
</body>
</html>
